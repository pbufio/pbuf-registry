{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pbuf-registry.fullname" . }}-ui
  labels:
    {{- include "pbuf-registry.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "pbuf-registry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "pbuf-registry.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: API_BASE_URL
              value: "http://{{ include "pbuf-registry.fullname" . }}:{{ .Values.service.http.port }}"
            - name: PUBLIC_ENABLED
              value: "{{ .Values.ui.publicEnabled }}"
            {{- if .Values.ui.apiToken }}
            - name: API_TOKEN
              value: "{{ .Values.ui.apiToken }}"
            {{- end }}
            {{- if .Values.ui.oidc.enabled }}
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER_URL
              value: "{{ .Values.ui.oidc.issuerUrl }}"
            - name: OIDC_CLIENT_ID
              value: "{{ .Values.ui.oidc.clientId }}"
            - name: OIDC_REDIRECT_URI
              value: "{{ .Values.ui.oidc.redirectUri }}"
            - name: OIDC_SCOPES
              value: "{{ .Values.ui.oidc.scopes | default "openid profile email" }}"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
{{- end }}
