name: Release Registry

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-wip.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.8.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and Ensure Release Tag
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|wip)\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "$GITHUB_ACTOR"
            git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *"rc"* ]] || [[ "$TAG" == *"wip"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Docker Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install doctl (Optional)
        if: env.DO_TOKEN != ''
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Docker Login DO (Optional)
        if: env.DO_TOKEN != ''
        run: doctl registry login

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7

      - name: Test
        run: make test && make test-ui

      - name: Build and Push Server Image
        env:
          REGISTRY_VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          make build-docker
          docker push ghcr.io/pbufio/registry:${REGISTRY_VERSION}
          docker tag ghcr.io/pbufio/registry:${REGISTRY_VERSION} ghcr.io/pbufio/pbuf-registry:${REGISTRY_VERSION}
          docker push ghcr.io/pbufio/pbuf-registry:${REGISTRY_VERSION}
          if [ "${{ steps.meta.outputs.is_prerelease }}" = "false" ]; then
            docker tag ghcr.io/pbufio/registry:${REGISTRY_VERSION} ghcr.io/pbufio/registry:latest
            docker push ghcr.io/pbufio/registry:latest
            docker tag ghcr.io/pbufio/registry:${REGISTRY_VERSION} ghcr.io/pbufio/pbuf-registry:latest
            docker push ghcr.io/pbufio/pbuf-registry:latest
          fi
          if [ -n "$DO_TOKEN" ]; then
            docker tag ghcr.io/pbufio/registry:${REGISTRY_VERSION} registry.digitalocean.com/pbuf/registry:${REGISTRY_VERSION}
            docker push registry.digitalocean.com/pbuf/registry:${REGISTRY_VERSION}
          fi

      - name: Build and Push Web UI Image
        env:
          REGISTRY_VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          make build-docker-ui
          docker push ghcr.io/pbufio/pbuf-registry-ui:${REGISTRY_VERSION}
          if [ "${{ steps.meta.outputs.is_prerelease }}" = "false" ]; then
            docker tag ghcr.io/pbufio/pbuf-registry-ui:${REGISTRY_VERSION} ghcr.io/pbufio/pbuf-registry-ui:latest
            docker push ghcr.io/pbufio/pbuf-registry-ui:latest
          fi

      - name: Release CLI Binaries with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.meta.outputs.tag }}

  release_charts:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.is_prerelease == 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package, Attach to GitHub Release, and Push OCI Chart to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          CHART_VERSION="${TAG#v}"
          mkdir -p .cr-release-packages
          helm lint charts/pbuf-registry/
          helm package charts/pbuf-registry/ --version "${CHART_VERSION}" --app-version "${TAG}" --destination .cr-release-packages

          gh release upload "${TAG}" ".cr-release-packages/pbuf-registry-${CHART_VERSION}.tgz" --clobber

          echo "${GH_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          helm push ".cr-release-packages/pbuf-registry-${CHART_VERSION}.tgz" oci://ghcr.io/pbufio/charts || \
            helm push ".cr-release-packages/pbuf-registry-${CHART_VERSION}.tgz" oci://ghcr.io/pbufio/helm

      - name: Ensure gh-pages Branch Exists and Update Helm Repo Index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          CHART_VERSION="${TAG#v}"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          WORKTREE_DIR="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add "${WORKTREE_DIR}" origin/gh-pages
            git -C "${WORKTREE_DIR}" checkout -B gh-pages
          else
            git worktree add --detach "${WORKTREE_DIR}"
            git -C "${WORKTREE_DIR}" checkout --orphan gh-pages
            git -C "${WORKTREE_DIR}" rm -rf . >/dev/null 2>&1 || true
          fi

          cp ".cr-release-packages/pbuf-registry-${CHART_VERSION}.tgz" "${WORKTREE_DIR}/"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          if [ -f "${WORKTREE_DIR}/index.yaml" ]; then
            helm repo index .cr-release-packages --url "${DOWNLOAD_URL}" --merge "${WORKTREE_DIR}/index.yaml"
          else
            helm repo index .cr-release-packages --url "${DOWNLOAD_URL}"
          fi
          cp .cr-release-packages/index.yaml "${WORKTREE_DIR}/index.yaml"
          rm -f "${WORKTREE_DIR}/pbuf-registry-${CHART_VERSION}.tgz"

          git -C "${WORKTREE_DIR}" add index.yaml
          if ! git -C "${WORKTREE_DIR}" diff --cached --quiet; then
            git -C "${WORKTREE_DIR}" commit -m "chore(charts): release pbuf-registry-${CHART_VERSION}"
            git -C "${WORKTREE_DIR}" push origin gh-pages
          fi

  upload_proto:
    runs-on: ubuntu-latest
    needs: release
    env:
      PBUF_TOKEN: ${{ secrets.PBUF_CLOUD_TOKEN }}
      PBUF_CA: ${{ secrets.PBUF_CA_CERT }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Checkout
        if: env.PBUF_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        if: env.PBUF_TOKEN != ''
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Build pbuf CLI
        if: env.PBUF_TOKEN != ''
        run: |
          make build-cli
          sudo install -m 0755 ./bin/pbuf /usr/local/bin/pbuf

      - name: Install custom CA certificate
        if: env.PBUF_TOKEN != '' && env.PBUF_CA != ''
        run: |
          sudo apt-get install -y ca-certificates
          sudo mkdir -p /usr/local/share/ca-certificates
          echo "$PBUF_CA" | sudo tee /usr/local/share/ca-certificates/pbuf.crt >/dev/null
          sudo update-ca-certificates

      - name: Authenticate, Register, and Push Module Tag
        if: env.PBUF_TOKEN != ''
        run: |
          pbuf auth "$PBUF_TOKEN"
          pbuf modules register || true
          if [ "${{ needs.release.outputs.is_prerelease }}" = "true" ]; then
            pbuf modules push "$TAG" --draft
          else
            pbuf modules push "$TAG"
          fi