name: Build and Test

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/**.md'
  pull_request:
    branches:
      - 'main'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7

      - name: Test Go (Server + CLI) with Coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          echo "### Go Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 15 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 1

      - name: Build Server, CLI, and Migrations
        run: make build && make build-cli && make build-migrations

      - name: Test and Build Web UI
        run: make test-ui && make build-ui

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint and Validate Helm Chart
        run: |
          helm lint charts/pbuf-registry/
          helm template pbuf-registry charts/pbuf-registry/ --set ui.enabled=true --set ingress.enabled=true > /dev/null

      - name: Docker build
        run: make docker && make build-docker-ui

  e2e-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_USER: pbuf
          POSTGRES_PASSWORD: pbuf
          POSTGRES_DB: pbuf_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbuf -d pbuf_registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Run E2E Tests (Migrations + Server + CLI + Examples)
        run: make test-e2e