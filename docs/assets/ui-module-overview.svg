<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="pbuf-registry Web UI — Module Overview, AST Metadata, and Proto Explorer">
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="12" y="12" width="936" height="516" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Top Navigation Header -->
  <path d="M12 24 C12 17.373 17.373 12 24 12 L936 12 C942.627 12 948 17.373 948 24 L948 68 L12 68 Z" fill="#121215"/>
  <line x1="12" y1="68" x2="948" y2="68" stroke="#27272a" stroke-width="1"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- Brand Logo -->
    <rect x="36" y="26" width="28" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
    <text x="50" y="45" text-anchor="middle" fill="#10b981" font-weight="800" font-size="14">P</text>
    <text x="74" y="46" fill="#fafafa" font-weight="800" font-size="17">pbuf.io</text>
    <text x="156" y="45" fill="#a1a1aa" font-weight="500" font-size="13.5">Modules</text>
    <text x="230" y="45" fill="#71717a" font-weight="500" font-size="13.5">Documentation</text>

    <!-- User Badge -->
    <rect x="810" y="26" width="114" height="28" rx="6" fill="#18181b" stroke="#27272a"/>
    <circle cx="826" cy="40" r="4" fill="#10b981"/>
    <text x="838" y="44" fill="#d4d4d8" font-size="12" font-weight="600">OIDC Verified</text>

    <!-- Breadcrumb & Title -->
    <text x="36" y="102" fill="#71717a" font-size="12.5">Modules  /  acme/payment-service  /  </text>
    <text x="252" y="102" fill="#e4e4e7" font-size="12.5" font-weight="600">v1.1.0</text>

    <text x="36" y="136" fill="#fafafa" font-size="24" font-weight="800">acme/payment-service</text>
    <rect x="312" y="116" width="64" height="24" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="344" y="132" text-anchor="middle" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700">v1.1.0</text>

    <rect x="386" y="116" width="108" height="24" rx="6" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="440" y="132" text-anchor="middle" fill="#60a5fa" font-size="11.5" font-weight="700">NO BREAKING DRIFT</text>

    <!-- Quick Vendor Command Card -->
    <rect x="610" y="96" width="314" height="48" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="624" y="114" fill="#71717a" font-size="10.5" font-weight="600">VENDOR IN PBUF.YAML</text>
    <text x="624" y="132" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">- name: acme/payment-service@v1.1.0</text>

    <!-- Tabs -->
    <line x1="36" y1="176" x2="924" y2="176" stroke="#27272a" stroke-width="1"/>
    <text x="48" y="166" fill="#10b981" font-size="13.5" font-weight="700">AST &amp; Packages (1)</text>
    <line x1="36" y1="176" x2="180" y2="176" stroke="#10b981" stroke-width="2.5"/>
    <text x="206" y="166" fill="#a1a1aa" font-size="13.5" font-weight="500">Proto Files (2)</text>
    <text x="330" y="166" fill="#a1a1aa" font-size="13.5" font-weight="500">Dependencies (2)</text>
    <text x="470" y="166" fill="#a1a1aa" font-size="13.5" font-weight="500">Drift Events (1)</text>

    <!-- Left Column: Parsed Services & Messages -->
    <rect x="36" y="196" width="430" height="308" rx="10" fill="#121215" stroke="#27272a"/>
    <text x="56" y="224" fill="#a1a1aa" font-size="11.5" font-weight="700">PACKAGE</text>
    <text x="122" y="224" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">acme.payment.v1</text>

    <!-- Service Block -->
    <rect x="56" y="240" width="390" height="88" rx="8" fill="#18181b" stroke="#27272a"/>
    <rect x="68" y="252" width="58" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="97" y="265" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="700">SERVICE</text>
    <text x="136" y="265" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">PaymentService</text>

    <text x="68" y="290" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">rpc <tspan fill="#e4e4e7" font-weight="600">Charge</tspan>(ChargeRequest) → ChargeResponse</text>
    <text x="68" y="312" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">rpc <tspan fill="#e4e4e7" font-weight="600">Refund</tspan>(RefundRequest) → RefundResponse</text>

    <!-- Message Block -->
    <rect x="56" y="340" width="390" height="146" rx="8" fill="#18181b" stroke="#27272a"/>
    <rect x="68" y="352" width="64" height="18" rx="4" fill="#10b981" fill-opacity="0.18"/>
    <text x="100" y="365" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="700">MESSAGE</text>
    <text x="142" y="365" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">ChargeRequest</text>

    <text x="68" y="392" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">#1  <tspan fill="#60a5fa">string</tspan>              <tspan fill="#e4e4e7">customer_id</tspan></text>
    <text x="68" y="416" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">#2  <tspan fill="#34d399">Money</tspan>               <tspan fill="#e4e4e7">amount</tspan></text>
    <text x="68" y="440" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">#3  <tspan fill="#60a5fa">string</tspan>              <tspan fill="#e4e4e7">idempotency_key</tspan></text>
    <text x="68" y="464" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">#4  <tspan fill="#f59e0b">map&lt;string,string&gt;</tspan>  <tspan fill="#e4e4e7">metadata</tspan></text>

    <!-- Right Column: Proto File Source Viewer -->
    <rect x="484" y="196" width="440" height="308" rx="10" fill="#121215" stroke="#27272a"/>
    <rect x="484" y="196" width="440" height="36" rx="10" fill="#18181b"/>
    <text x="504" y="219" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">api/payment/v1/payment.proto</text>
    <text x="866" y="219" fill="#10b981" font-size="11.5" font-weight="600">proto3</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="504" y="254" fill="#52525b"> 1</text><text x="532" y="254" fill="#c084fc">syntax</text><text x="582" y="254" fill="#e4e4e7">= </text><text x="596" y="254" fill="#86efac">"proto3"</text><text x="654" y="254" fill="#71717a">;</text>
      <text x="504" y="274" fill="#52525b"> 2</text><text x="532" y="274" fill="#c084fc">package</text><text x="590" y="274" fill="#e4e4e7">acme.payment.v1;</text>
      <text x="504" y="294" fill="#52525b"> 3</text><text x="532" y="294" fill="#c084fc">option</text><text x="582" y="294" fill="#e4e4e7">go_package = </text><text x="676" y="294" fill="#86efac">".../payment/v1"</text><text x="792" y="294" fill="#71717a">;</text>
      <text x="504" y="318" fill="#52525b"> 4</text><text x="532" y="318" fill="#60a5fa">message</text><text x="590" y="318" fill="#fde047">ChargeRequest</text><text x="692" y="318" fill="#e4e4e7">{</text>
      <text x="504" y="338" fill="#52525b"> 5</text><text x="548" y="338" fill="#93c5fd">string</text><text x="600" y="338" fill="#e4e4e7">customer_id = </text><text x="702" y="338" fill="#fca5a5">1</text><text x="710" y="338" fill="#71717a">;</text>
      <text x="504" y="358" fill="#52525b"> 6</text><text x="548" y="358" fill="#6ee7b7">Money</text><text x="600" y="358" fill="#e4e4e7">amount = </text><text x="666" y="358" fill="#fca5a5">2</text><text x="674" y="358" fill="#71717a">;</text>
      <text x="504" y="378" fill="#52525b"> 7</text><text x="548" y="378" fill="#93c5fd">string</text><text x="600" y="378" fill="#e4e4e7">idempotency_key = </text><text x="730" y="378" fill="#fca5a5">3</text><text x="738" y="378" fill="#71717a">;</text>
      <text x="504" y="398" fill="#52525b"> 8</text><text x="548" y="398" fill="#fcd34d">map&lt;string, string&gt;</text><text x="692" y="398" fill="#e4e4e7">metadata = </text><text x="772" y="398" fill="#fca5a5">4</text><text x="780" y="398" fill="#71717a">;</text>
      <text x="504" y="418" fill="#52525b"> 9</text><text x="532" y="418" fill="#e4e4e7">}</text>
      <text x="504" y="442" fill="#52525b">10</text><text x="532" y="442" fill="#c084fc">service</text><text x="590" y="442" fill="#fde047">PaymentService</text><text x="698" y="442" fill="#e4e4e7">{</text>
      <text x="504" y="462" fill="#52525b">11</text><text x="548" y="462" fill="#c084fc">rpc</text><text x="578" y="462" fill="#86efac">Charge</text><text x="624" y="462" fill="#e4e4e7">(ChargeRequest) </text><text x="738" y="462" fill="#c084fc">returns</text><text x="794" y="462" fill="#e4e4e7">(ChargeResponse);</text>
      <text x="504" y="482" fill="#52525b">12</text><text x="532" y="482" fill="#e4e4e7">}</text>
    </g>
  </g>
</svg>
