version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: pbuf
    main: ./cmd/pbuf
    binary: pbuf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: pbuf
    formats:
      - tar.gz
    name_template: "pbuf_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: pbufio
    name: pbuf-registry
  extra_files:
    - glob: ./scripts/install.sh

brews:
  - name: pbuf
    ids:
      - pbuf
    homepage: "https://pbuf.io"
    description: "CLI for pbuf-registry — Protocol Buffers schema registry, multi-source vendoring, drift detection, and MCP server"
    license: "Apache-2.0"
    directory: Formula
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"
    repository:
      owner: pbufio
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    test: |
      system "#{bin}/pbuf --help"
