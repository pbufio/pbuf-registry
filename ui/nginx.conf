# Map to identify endpoints that allow POST method
map $request_uri $allow_post {
    default 0;
    "~^/api/v1/modules/get" 1;
    "~^/api/v1/modules/pull" 1;
    "~^/api/v1/modules/dependencies" 1;
    "~^/api/v1/metadata" 1;
    "~^/api/v1/drift/modules/events" 1;
    "~^/api/v1/drift/modules/dependencies/status" 1;
}

# Prefer a browser-provided Authorization header (token login), otherwise fall back
# to the server-side API_TOKEN (if configured).
map "${PUBLIC_ENABLED}" $public_enabled {
    default 0;
    ~*^(1|true|yes|on)$ 1;
}

map "${API_TOKEN}" $api_token_bearer {
    default "Bearer ${API_TOKEN}";
    "" "";
}

map "$http_authorization:$public_enabled" $upstream_authorization {
    default $http_authorization;
    ~^:1$ $api_token_bearer;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config is generated at container startup based on environment variables.
    # It must never be cached (PUBLIC_ENABLED may change between container runs).
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API Proxy - forwards /api requests to backend server
    # Matches Vite dev server proxy configuration
    # Specific endpoints allow POST (defined in map above), others are read-only (GET/OPTIONS only)
    location /api/ {
        # Method restrictions based on endpoint
        if ($allow_post = 0) {
            set $test_method "${request_method}";
        }
        if ($test_method = "POST") { return 405; }
        if ($test_method = "PUT") { return 405; }
        if ($test_method = "DELETE") { return 405; }
        if ($test_method = "PATCH") { return 405; }
        
        # Strip /api prefix (matches Vite's rewrite behavior)
        rewrite ^/api/(.*)$ /$1 break;
        
        # Environment variable API_BASE_URL will be replaced at runtime
        # Default: http://pbuf.cloud
        proxy_pass ${API_BASE_URL};
        
        # Proxy headers
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Authorization header support
        proxy_set_header Authorization $upstream_authorization;
        
        # Disable buffering for streaming responses
        proxy_buffering off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Handle Vue Router (SPA) - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
