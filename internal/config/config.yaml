server:
  http:
    addr: 0.0.0.0:8080
    timeout: 30s
    auth:
      enabled: false
      type:
      oidc:
        issuerUrl:
        clientId:
        jwksUrl:
        usernameClaim: email
        groupsClaim: groups
        adminGroups: []
        autoProvision: true
  grpc:
    addr: 0.0.0.0:6777
    timeout: 30s
    tls:
      enabled: false
      certFile:
      keyFile:
    auth:
      enabled: false
      type:
      oidc:
        issuerUrl:
        clientId:
        jwksUrl:
        usernameClaim: email
        groupsClaim: groups
        adminGroups: []
        autoProvision: true
  debug:
    addr: 0.0.0.0:8082
    timeout: 10s

data:
  database:
    dsn: "postgres://pbuf:pbuf@localhost:5432/pbuf_registry?sslmode=disable"

daemons:
  compaction:
    cron: "0 * * * *"
  protoparsing:
    cron: "*/1 * * * *"
  driftdetection:
    cron: "*/5 * * * *"
